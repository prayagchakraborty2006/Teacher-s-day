
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Teachers' Day!</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
        rel="stylesheet"
    >

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74ebe7 0%, #86a3ff 100%);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.1);

            text-align: center;

            max-width: 520px;
            width: 100%;

            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 10px;

            animation: bounce 2s infinite;
        }

        h1 {
            color: #333;

            font-weight: 800;

            font-size: 2.2rem;

            margin-bottom: 15px;

            line-height: 1.2;
        }

        h1 span {
            color: #4a6cf7;
        }

        .sub-text {
            color: #666;

            font-size: 1rem;

            margin-bottom: 30px;
        }

        /* Message Card */

        .card {
            background: #f8faff;

            border-left: 5px solid #4a6cf7;

            padding: 22px;

            border-radius: 10px;

            margin-bottom: 25px;

            display: none;

            opacity: 0;

            transform: scale(0.9);

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;
        }

        .card p {
            font-style: italic;

            color: #444;

            line-height: 1.7;

            font-size: 0.98rem;
        }

        .card .author {
            display: block;

            margin-top: 12px;

            font-weight: 600;

            color: #4a6cf7;

            font-size: 0.9rem;
        }

        /* From Prayag */

        .from-prayag {
            margin-top: 18px;

            color: #555;

            font-size: 0.95rem;

            font-weight: 600;

            text-align: right;
        }

        /* Button */

        .wish-btn {
            background: #4a6cf7;

            color: white;

            border: none;

            padding: 15px 35px;

            font-size: 1.1rem;

            font-weight: 600;

            border-radius: 50px;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(74, 108, 247, 0.3);

            transition:
                background 0.3s,
                transform 0.2s;
        }

        .wish-btn:hover {
            background: #3556d8;

            transform: scale(1.05);
        }

        .wish-btn:active {
            transform: scale(0.98);
        }

        .personal-note {
            margin-top: 18px;

            color: #888;

            font-size: 0.78rem;
        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="icon">👩‍🏫</div>

        <h1>
            Happy <span>Teachers' Day!</span>
        </h1>

        <p class="sub-text">
            To the mentors who ignite minds and shape the future.
        </p>


        <!-- Random Message Card -->

        <div class="card" id="messageCard">

            <p id="messageText"></p>

            <span class="author">
                — With Gratitude, Your Student<br>
                <strong>Prayag</strong>
            </span>

            <div class="from-prayag">
                Seeking your blessings and prayers 💙
            </div>

        </div>


        <button
            class="wish-btn"
            id="wishBtn"
            onclick="revealWish()"
        >
            Click to Celebrate 🎉
        </button>

        

    </div>


    <script>

        /*
        ==========================================
        TEACHER MESSAGES
        ==========================================
        */

        const teacherMessages = [

            "A good teacher doesn't just teach lessons; they inspire us to become better versions of ourselves. Thank you for being that inspiration. 🌟",

            "Behind every confident student is a teacher who believed in them when they doubted themselves. Thank you for always believing in me. 💙",

            "Your classroom may have four walls, but your lessons have taken us far beyond them. Thank you for opening our minds to new possibilities. 🌍",

            "Teachers plant seeds of knowledge that continue to grow long after the classroom is left behind. Thank you for planting those seeds in us. 🌱",

            "You didn't just teach us what was written in a book—you taught us how to think, question, learn and grow. Happy Teachers' Day! 📚",

            "Some lessons are forgotten after an exam, but the lessons taught by a great teacher stay with us for life. Thank you for making a difference. ❤️",

            "Thank you for your patience when we didn't understand, your encouragement when we struggled, and your belief when we needed it most. 🌟",

            "A teacher's greatest achievement isn't a perfect answer sheet—it's seeing their students become capable, curious and confident people. Thank you! 🎓",

            "Every question you answered, every mistake you corrected, and every little encouragement you gave helped shape who we are today. Thank you! 💫",

            "The best teachers don't simply fill our minds with knowledge; they awaken our curiosity. Thank you for making learning exciting. 🔥",

            "Your lessons may end when the bell rings, but their impact continues far beyond the classroom. Thank you for everything you do. 🍎",

            "Thank you for turning confusion into understanding, mistakes into lessons, and challenges into opportunities to grow. Happy Teachers' Day! 🌈",

            "A great teacher can change a student's perspective, confidence and future. Thank you for being someone who makes that difference every day. ✨",

            "The knowledge you share is valuable, but the confidence and encouragement you give your students are priceless. Thank you! 💙",

            "To the teacher who makes difficult things feel possible—thank you for your guidance, patience and endless encouragement. Happy Teachers' Day! 🎉"

        ];


        /*
        ==========================================
        GET ONE PERMANENT MESSAGE
        ==========================================
        */

        function getTeacherMessage() {

            // Check whether this teacher already has a message
            let savedMessage =
                localStorage.getItem("prayagTeacherMessage");

            // If yes, return the same message
            if (savedMessage) {
                return savedMessage;
            }

            // Otherwise choose a random message
            const randomIndex =
                Math.floor(
                    Math.random() * teacherMessages.length
                );

            const selectedMessage =
                teacherMessages[randomIndex];

            // Save it permanently for this browser
            localStorage.setItem(
                "prayagTeacherMessage",
                selectedMessage
            );

            return selectedMessage;
        }


        /*
        ==========================================
        REVEAL WISH
        ==========================================
        */

        function revealWish() {

            const card =
                document.getElementById("messageCard");

            const btn =
                document.getElementById("wishBtn");

            /*
            Get the teacher's permanently
            assigned message.
            */

            const message =
                getTeacherMessage();

            document.getElementById("messageText")
                .textContent = message;


            /*
            Confetti celebration
            */

            confetti({
                particleCount: 150,

                spread: 80,

                origin: {
                    y: 0.6
                }
            });


            /*
            Reveal message
            */

            card.style.display = "block";

            requestAnimationFrame(() => {

                card.style.opacity = "1";

                card.style.transform =
                    "scale(1)";

            });


            /*
            Disable button after first click.
            The teacher gets only ONE message.
            */

            btn.innerHTML =
                "Happy Teachers' Day! 🎉";

            btn.disabled = true;

            btn.style.cursor = "default";

            btn.style.opacity = "0.85";

        }

    </script>

</body>
</html>
